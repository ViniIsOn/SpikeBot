plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
android {
    namespace 'br.com.poderazul.spikesbot'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.poderazul.spikesbot'
        minSdk 30
        targetSdk 34
        versionCode 18
        versionName '1.8-recuperacao'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
